    title: Record/replay golden tests
    doc: WS-01_record_replay_tests.md
    status: in_progress  # working implementation in additions/scenarios (11 scenarios, 3 lanes); left: record CLI flag, git mv to tests/scenarios, CI job
    implementation: additions/scenarios
    effort_days: 1  # remaining
    depends_on: [P0]
    principles: [P5, P1]
    dsh_refs: [packages/testing/llm-replay, packages/testing/session-snapshot, client/testing]
    files_add:
      - tests/scenarios/conftest.py
      - tests/scenarios/_lib/{replay_provider,normalize,sse,dom}.py
      - tests/scenarios/test_scenarios.py
      - tests/scenarios/<8 scenarios>/
      - tools/headless_timeline.mjs
      - tests/frontends/package.json
      - docs/testing/SCENARIOS.md
    files_modify:
      - harness/sdk/testing/{__init__,scripted}.py
      - .github/workflows/ci.yml
      - pyproject.toml
      - .gitignore
    tests:
      - tests/scenarios/test_scenarios.py
      - tests/kernel/test_replay_provider.py
      - tests/scenarios/_lib/test_normalize.py
    acceptance:
      - pytest tests/scenarios -q
