    split: [WS-03a kernel seams, WS-03b hook plugins]
    principles: [P1, P2, P6]
    dsh_refs: [packages/features/tool-result-pruner, packages/features/tool-result-store, packages/features/repeat-tool-call-reminder, packages/core/tool-execution, packages/features/file-edit-guard]
    files_add:
