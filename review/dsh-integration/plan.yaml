# Machine-readable index of the DeepSeek-Harness integration pack.
# Source of truth for sequencing; the WS-*.md files are the source of truth for design.
# Status values: specified | in_progress | landed | dropped
version: 1
baseline:
  harness_zero_commit: f43c272
  dsh_commit: 86a40220
  research_doc: review/RESEARCH_DEEPSEEK_HARNESS.md
  principles: review/dsh-integration/00_PRINCIPLES.md
  plugin_template: review/dsh-integration/templates/PLUGIN_TEMPLATE.md
prerequisites:
  - id: P0
    title: "v0.2.1 review §8 critical path: client SSE listeners, submit_turn payload, session bootstrap, error surfacing"
    doc: review/CODE_REVIEW_v0.2.1.md#8
    required_by: [WS-01, WS-02, WS-05]
    status: landed  # on branch arena/99a86436-harness-zero (PR #4); evidence: additions/FLOW_TEST_FINDINGS.md F-2/F-3/F-4/F-6/F-8
global_gates:
  - one PR per workstream (WS-03/04/06/10/11 may split into a/b/c as their spec says)
  - at least one fail-first test quoted in the PR description
  - no placeholders (data-notice, noop, sample data, "coming soon")
  - ruff check . && pytest -q && harness plugin doctor --all && harness catalog --check (after WS-02)
  - catalogs regenerated, CHANGELOG line links to catalog diff
  - THIRD_PARTY_NOTICES.md for any verbatim port from dsh (MIT)

workstreams:
