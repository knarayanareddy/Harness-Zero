      - plugins.hooks-tool-result-pruner.{enabled,threshold_chars,head_chars,tail_chars,exempt_tools}
      - plugins.hooks-tool-result-spill.{enabled,threshold_chars,max_files_per_session}
      - plugins.hooks-repeat-call-reminder.{repeat_after,block_after}
      - plugins.hooks-read-before-edit.{enabled,mode,exempt_globs}
