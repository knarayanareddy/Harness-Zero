name: sandbox_unavailable_required_denies
kind: kernel
summary: Even explicit permission bypass cannot make required mode run an executor unconfined when the selected backend is unavailable.
recorded_from: synthetic
settings:
  kernel.security.preset: open
  kernel.security.permission_mode: bypass
  kernel.sandbox.mode: required
  kernel.sandbox.backend: none
turns:
  - prompt: "Create ran.txt with the shell."
expect:
  tools_called: [run_command]
  files:
    ran.txt: {exists: false}
  events_match:
    - {type: tool.decision, data: {action: deny, metadata: {sandbox: {available: false, mode: required}}}}
    - {type: tool.result, data: {is_error: true}}
  model_saw: ["sandbox unavailable on this host"]
  event_types_exclude: [turn.error]
  stop_reasons: [end_turn]
