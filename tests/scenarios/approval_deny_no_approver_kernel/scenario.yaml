name: approval_deny_no_approver_kernel
kind: kernel
summary: Same WRITE in `ask` mode with no interactive subscriber on the bus — must be denied immediately (fail closed) and the model told.
recorded_from: synthetic
settings:
  kernel.security.permission_mode: ask
turns:
