name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install bubblewrap for Linux sandbox integration tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies (jsdom for the scenario DOM lane, tailwindcss)
        run: |
          npm ci --include=dev
          npm ls --depth=0 jsdom tailwindcss

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Check import boundaries
        run: |
          pytest -q tests/kernel/test_import_boundaries.py

      - name: Run hermetic test suite (kernel, plugins, frontends, e2e, scenarios)
        env:
          SCENARIO_DOM_WAIT_MS: "6000"
        run: |
          export HOME=$(mktemp -d)
          export HARNESS_CONFIG_DIR=$HOME/.harness
          report="$RUNNER_TEMP/pytest-results.xml"
          if pytest -q -rs --junitxml="$report"; then
            exit 0
          else
            pytest_status=$?
          fi
          python - "$report" <<'PY' || true
          import sys
          import xml.etree.ElementTree as ET

          try:
              root = ET.parse(sys.argv[1]).getroot()
          except (OSError, ET.ParseError) as exc:
              print(f"::error title=Pytest diagnostics unavailable::{exc}")
          else:
              failures = [
                  (case, result)
                  for case in root.iter("testcase")
                  for result in (*case.findall("failure"), *case.findall("error"))
              ]
              for case, result in failures[:25]:
                  reason = result.get("message") or ((result.text or "").strip().splitlines() or [""])[0]
                  message = f"{case.get('classname', '')}::{case.get('name', '')}: {reason}"
                  message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Pytest failure::{message[:1000]}")
              print(f"::notice title=Pytest failure summary::{len(failures)} failing tests; details follow in annotations")
          PY
          exit "$pytest_status"

      - name: Run plugin doctor
        run: |
          harness plugin doctor --all

      - name: Run plugin test suites
        run: |
          harness plugin test --all

      - name: Verify generated catalogues and freshness gates (WS-02)
        if: runner.os == 'Linux'
        run: |
          harness catalog --check --section drift --section settings --section ui

      - name: Verify compiled Tailwind is fresh (vendor/tw.css)
        run: |
          npm run build:css
          git diff --exit-code -- harness/frontends/web/static/vendor/tw.css

      - name: Web UI static audit
        run: |
          python tests/frontends/ui_audit.py --strict

      - name: Verify clean working tree
        run: |
          test -z "$(git status --porcelain)"
