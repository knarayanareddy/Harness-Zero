[project]
name = "harness-zero"
version = "0.2.1"
description = "Sovereign Autonomous Agent Engine synthesized from Google Antigravity, Claude Cowork, ChatGPT Sky, Hermes, Pi, and Aider"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Harness-Zero Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "rich>=13.7.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.0",
]
package = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
harness = "harness.cli:main"
harness-zero = "harness.cli:main"

[project.entry-points.pytest11]
harness = "harness.sdk.testing"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "scenario: flow-of-information scenario test — real kernel/daemon/client, recorded model (tests/scenarios)",
    "web: a scenario with a web lane (daemon + SSE, and the shipped client in jsdom when node is installed)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]
